
name: Build Projeto Caos APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado"
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project
        run: unzip -q ProjetoCaosAndroid_Fonte-1.zip

      - name: Repair Gradle properties
        run: |
          python3 - <<'PY'
          from pathlib import Path

          file = Path("ProjetoCaosAndroid/gradle.properties")
          content = file.read_bytes()
          content = content.replace(b"\\n", b"\n")
          file.write_bytes(content)

          print("Propriedades corrigidas.")
          PY

      - name: Configure Java and Kotlin
        working-directory: ProjetoCaosAndroid
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3"
              id("org.jetbrains.kotlin.android") version "2.0.21"
          }

          android {
              namespace = "com.projetocaos.game"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.projetocaos.game"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Build APK
        working-directory: ProjetoCaosAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: projeto-caos-apk
          path: ProjetoCaosAndroid/app/build/outputs/apk/debug/app-debug.apk
          
